  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Wind Effect",
    "url": "https://amitj.me/weather-effects/wind.html",
    "description": "Canvas wind: gust lines sweep through in bursts, curl mid-air and dissolve, carrying tumbling autumn leaves. Calm air stays empty between gusts.",
    "isPartOf": { "@type": "WebSite", "name": "Weather Effects", "url": "https://amitj.me/weather-effects/" },

  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #46535e; }
    #wind { display: block; width: 100vw; height: 100vh; }

    .panel {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(10, 14, 28, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px;
      color: #cdd6e8;
      font: 13px/1.5 system-ui, sans-serif;
      display: grid;
      gap: 12px;
      min-width: 220px;
      user-select: none;
    }
    .panel label { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .panel input[type="range"] { width: 120px; accent-color: #d4bd7f; }
    .panel input[type="checkbox"] { accent-color: #d4bd7f; }
    .seg { display: flex; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; overflow: hidden; }
    .seg button {
      flex: 1;
      padding: 5px 0;
      background: transparent;
      border: 0;
      color: #cdd6e8;
      cursor: pointer;
      font: inherit;
    }
    .seg button.active { background: #d4bd7f; color: #0b0f1e; font-weight: 600; }
  </style>
</head>
<body>
  <a href="./" style="position:fixed;top:16px;left:16px;z-index:5;background:rgba(10,14,28,0.75);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:999px;color:#cdd6e8;font:12.5px system-ui,sans-serif;padding:7px 14px;text-decoration:none">&larr; All weather effects</a>
  <canvas id="wind"></canvas>

  <div class="panel">
    <label>Wind <span id="strengthVal">6</span>
      <input id="strength" type="range" min="-10" max="10" value="6" />
    </label>
    <div>
      <div style="margin-bottom:6px">Intensity</div>
      <div class="seg" id="intensity">
        <button data-level="low">Low</button>
        <button data-level="mid" class="active">Mid</button>
        <button data-level="high">High</button>
      </div>
    </div>
    <label>Leaves <input id="leaves" type="checkbox" checked /></label>
  </div>

  <script src="wind.js"></script>
  <script>
    const windFx = new WindEffect(document.getElementById('wind'), {
      wind: 6,
      intensity: 'mid',
      leaves: true,
    });

    const strength = document.getElementById('strength');
    const strengthVal = document.getElementById('strengthVal');
    strength.addEventListener('input', () => {
      windFx.setWind(+strength.value);
      strengthVal.textContent = strength.value;
    });

    document.getElementById('intensity').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      windFx.setIntensity(btn.dataset.level);
      for (const b of btn.parentElement.children) b.classList.toggle('active', b === btn);
    });

    document.getElementById('leaves').addEventListener('change', (e) => windFx.setLeaves(e.target.checked));
  </script>
</body>
</html>
