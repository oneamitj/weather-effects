  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Sky Effect",
    "url": "https://amitj.me/weather-effects/sky.html",
    "description": "A canvas day sky: dawn, day, dusk and night phases, volumetric cumulus and cirrus clouds, a sun that dims behind cover, and passing bird flocks.",
    "isPartOf": { "@type": "WebSite", "name": "Weather Effects", "url": "https://amitj.me/weather-effects/" },

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #3b74b8; }
    #sky { display: block; width: 100vw; height: 100vh; }

    .panel {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(10, 14, 28, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px;
      color: #cdd6e8;
      font: 13px/1.5 system-ui, sans-serif;
      display: grid;
      gap: 12px;
      min-width: 220px;
      user-select: none;
    }
    .panel label { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .panel input[type="range"] { width: 120px; accent-color: #f2c14e; }
    .panel input[type="checkbox"] { accent-color: #f2c14e; }
    .seg { display: flex; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; overflow: hidden; }
    .seg button {
      flex: 1;
      padding: 5px 0;
      background: transparent;
      border: 0;
      color: #cdd6e8;
      cursor: pointer;
      font: inherit;
    }
    .seg button.active { background: #f2c14e; color: #0b0f1e; font-weight: 600; }
    .control.disabled { opacity: 0.35; pointer-events: none; }
  </style>
</head>
<body>
  <a href="./" style="position:fixed;top:16px;left:16px;z-index:5;background:rgba(10,14,28,0.75);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:999px;color:#cdd6e8;font:12.5px system-ui,sans-serif;padding:7px 14px;text-decoration:none">&larr; All weather effects</a>
  <canvas id="sky"></canvas>

  <div class="panel">
    <label>Wind <span id="windVal">2</span>
      <input id="wind" type="range" min="-10" max="10" value="2" />
    </label>
    <div>
      <div style="margin-bottom:6px">Phase</div>
      <div class="seg" id="phase">
        <button data-phase="dawn">Dawn</button>
        <button data-phase="day" class="active">Day</button>
        <button data-phase="dusk">Dusk</button>
        <button data-phase="night">Night</button>
      </div>
    </div>
    <div>
      <div style="margin-bottom:6px">Mode</div>
      <div class="seg" id="mode">
        <button data-mode="clear">Clear</button>
        <button data-mode="partly" class="active">Partly</button>
        <button data-mode="cloudy">Cloudy</button>
      </div>
    </div>
    <div class="control" id="intensityWrap">
      <div style="margin-bottom:6px">Intensity</div>
      <div class="seg" id="intensity">
        <button data-level="low">Low</button>
        <button data-level="mid" class="active">Mid</button>
        <button data-level="high">High</button>
      </div>
    </div>
    <label>Birds <input id="birds" type="checkbox" checked /></label>
  </div>

  <script src="sky.js"></script>
  <script>
    const sky = new SkyEffect(document.getElementById('sky'), {
      wind: 2,
      phase: 'day',
      mode: 'partly',
      intensity: 'mid',
      birds: true,
    });

    const wind = document.getElementById('wind');
    const windVal = document.getElementById('windVal');
    wind.addEventListener('input', () => {
      sky.setWind(+wind.value);
      windVal.textContent = wind.value;
    });

    document.getElementById('phase').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      sky.setPhase(btn.dataset.phase);
      for (const b of btn.parentElement.children) b.classList.toggle('active', b === btn);
    });

    const intensityWrap = document.getElementById('intensityWrap');
    document.getElementById('mode').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      sky.setMode(btn.dataset.mode);
      for (const b of btn.parentElement.children) b.classList.toggle('active', b === btn);
      intensityWrap.classList.toggle('disabled', btn.dataset.mode === 'clear');
    });

    document.getElementById('intensity').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      sky.setIntensity(btn.dataset.level);
      for (const b of btn.parentElement.children) b.classList.toggle('active', b === btn);
    });

    document.getElementById('birds').addEventListener('change', (e) => sky.setBirds(e.target.checked));
  </script>
</body>
</html>
