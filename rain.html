  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Rain Effect",
    "url": "https://amitj.me/weather-effects/rain.html",
    "description": "Animated canvas rain with adjustable slant, three intensities, splashes and procedural lightning. Pure JavaScript, no libraries, works offline.",
    "isPartOf": { "@type": "WebSite", "name": "Weather Effects", "url": "https://amitj.me/weather-effects/" },
    "author": { "@type": "Person", "name": "Amit Joshi" },

  }

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #07131c; }
    #rain { display: block; width: 100vw; height: 100vh; }

    .panel {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(10, 14, 28, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px;
      color: #cdd6e8;
      font: 13px/1.5 system-ui, sans-serif;
      display: grid;
      gap: 12px;
      min-width: 220px;
      user-select: none;
    }
    .panel label { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .panel input[type="range"] { width: 120px; accent-color: #6d8dff; }
    .panel input[type="checkbox"] { accent-color: #6d8dff; }
    .seg { display: flex; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; overflow: hidden; }
    .seg button {
      flex: 1;
      padding: 5px 0;
      background: transparent;
      border: 0;
      color: #cdd6e8;
      cursor: pointer;
      font: inherit;
    }
    .seg button.active { background: #6d8dff; color: #0b0f1e; font-weight: 600; }
    .hint { font-size: 11px; opacity: 0.6; }
  </style>
</head>
<body>
  <a href="./" style="position:fixed;top:16px;left:16px;z-index:5;background:rgba(10,14,28,0.75);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:999px;color:#cdd6e8;font:12.5px system-ui,sans-serif;padding:7px 14px;text-decoration:none">&larr; All weather effects</a>
  <canvas id="rain"></canvas>

  <div class="panel">
    <label>Angle <span id="angleVal">15&deg;</span>
      <input id="angle" type="range" min="-45" max="45" value="15" />
    </label>
    <div>
      <div style="margin-bottom:6px">Intensity</div>
      <div class="seg" id="intensity">
        <button data-level="low">Low</button>
        <button data-level="mid" class="active">Mid</button>
        <button data-level="high">High</button>
      </div>
    </div>
    <label>Thunder <input id="thunder" type="checkbox" checked /></label>
  </div>

  <script src="rain.js"></script>
  <script>
    const rain = new RainEffect(document.getElementById('rain'), {
      angle: 15,
      intensity: 'mid',
      thunder: true,
    });

    const angle = document.getElementById('angle');
    const angleVal = document.getElementById('angleVal');
    angle.addEventListener('input', () => {
      rain.setAngle(+angle.value);
      angleVal.innerHTML = angle.value + '&deg;';
    });

    document.getElementById('intensity').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      rain.setIntensity(btn.dataset.level);
      for (const b of btn.parentElement.children) b.classList.toggle('active', b === btn);
    });

    document.getElementById('thunder').addEventListener('change', (e) => rain.setThunder(e.target.checked));
  </script>
</body>
</html>
